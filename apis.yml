name: SeedLegals
description: >-
  SeedLegals is a legal-technology platform that helps startups, founders and
  investors handle their company legals end to end — from incorporation and cap
  table management through fundraising (SEIS/EIS, SAFEs, priced rounds, agile
  funding top-ups), share options and team agreements, to R&D tax credit claims
  and ongoing compliance. Trusted by 60,000+ startups and investors across the
  UK, France and the US, it replaces traditional law-firm workflows with guided,
  self-serve document generation plus expert support. SeedLegals does not
  publish a public REST/OpenAPI developer program, but it operates a hosted,
  OAuth-protected Model Context Protocol (MCP) server at api.seedlegals.com/mcp
  and a FusionAuth-based OpenID Connect identity provider, both discoverable via
  standard OAuth/OIDC well-known metadata.
